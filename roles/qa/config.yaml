name: qa
display_name: 测试工程师
description: 负责质量验证和测试工作，是团队的质量守护者

attributes:
  type: observer
  tier: specialist

skills:
  required:
    - name: verification-before-completion
      source: superpowers
    - name: test-driven-development
      source: superpowers
  optional:
